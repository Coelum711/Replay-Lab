<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replay Lab · 打开方式</title>
<style>body{margin:0;background:#101219;color:#edf2ff;font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;padding:24px}.card{max-width:760px;margin:8vh auto 0;background:#181c25;border:1px solid #30384b;border-radius:14px;padding:22px}h1{margin-top:0;font-size:22px}code{background:#0e131c;padding:2px 6px;border-radius:5px;color:#d7defc}.warn{border-left:3px solid #d6bf72;padding-left:10px;color:#e8d89f}.muted{color:#98a3bc}.ok{color:#76d5ae}</style></head>
<body><div class="card"><h1>Replay Lab</h1><div id="message"></div></div>
<script>(()=>{const m=document.getElementById('message');if(location.protocol==='http:'||location.protocol==='https:'){m.innerHTML='<p class="ok">正在打开 Studio…</p>';location.replace('./web/studio.html');return}m.innerHTML=`<p class="warn"><strong>不要直接双击 web/studio.html。</strong> Studio 使用浏览器 ES Module，file:// 模式下很多按钮会看起来存在但不会工作。</p><p>在解压后的 Replay Lab 根目录运行：</p><p><strong>Windows：</strong> <code>START_REPLAY_LAB.bat</code><br><strong>macOS：</strong> <code>START_REPLAY_LAB.command</code><br><strong>Linux：</strong> <code>START_REPLAY_LAB.sh</code></p><p>或者在终端运行 <code>python3 launch_replay_lab.py</code>。</p><p class="muted">启动器只监听 127.0.0.1，本机之外无法访问；关闭启动器窗口即可停止。</p>`})();</script></body></html>
